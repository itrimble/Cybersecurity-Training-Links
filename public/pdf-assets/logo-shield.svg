<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffcc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00b894;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2d4a;stop-opacity:1" />
    </linearGradient>
    <filter id="shieldGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer shield shape -->
  <path d="M100,10 L180,50 L180,120 C180,180 100,220 100,220 C100,220 20,180 20,120 L20,50 Z"
        fill="url(#shieldGrad)" filter="url(#shieldGlow)"/>

  <!-- Inner shield -->
  <path d="M100,25 L165,58 L165,115 C165,165 100,200 100,200 C100,200 35,165 35,115 L35,58 Z"
        fill="url(#innerGrad)"/>

  <!-- Lock icon -->
  <rect x="75" y="100" width="50" height="40" rx="5" fill="#00ffcc"/>
  <rect x="85" y="75" width="30" height="35" rx="15" fill="none" stroke="#00ffcc" stroke-width="6"/>
  <circle cx="100" cy="118" r="8" fill="#0a1628"/>
  <rect x="97" y="118" width="6" height="12" fill="#0a1628"/>

  <!-- Circuit lines -->
  <line x1="60" y1="70" x2="45" y2="70" stroke="#00ffcc" stroke-width="2" opacity="0.6"/>
  <line x1="45" y1="70" x2="45" y2="90" stroke="#00ffcc" stroke-width="2" opacity="0.6"/>
  <circle cx="45" cy="90" r="3" fill="#00ffcc" opacity="0.6"/>

  <line x1="140" y1="70" x2="155" y2="70" stroke="#00ffcc" stroke-width="2" opacity="0.6"/>
  <line x1="155" y1="70" x2="155" y2="90" stroke="#00ffcc" stroke-width="2" opacity="0.6"/>
  <circle cx="155" cy="90" r="3" fill="#00ffcc" opacity="0.6"/>

  <line x1="60" y1="150" x2="45" y2="150" stroke="#00ffcc" stroke-width="2" opacity="0.6"/>
  <line x1="45" y1="150" x2="45" y2="130" stroke="#00ffcc" stroke-width="2" opacity="0.6"/>
  <circle cx="45" cy="130" r="3" fill="#00ffcc" opacity="0.6"/>

  <line x1="140" y1="150" x2="155" y2="150" stroke="#00ffcc" stroke-width="2" opacity="0.6"/>
  <line x1="155" y1="150" x2="155" y2="130" stroke="#00ffcc" stroke-width="2" opacity="0.6"/>
  <circle cx="155" cy="130" r="3" fill="#00ffcc" opacity="0.6"/>
</svg>
