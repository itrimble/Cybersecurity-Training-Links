<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2d4a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bgGrad3)"/>

  <!-- Title -->
  <text x="250" y="35" fill="#00ffcc" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" filter="url(#glow3)">Top Skills Gaps 2026</text>

  <!-- Radar Grid -->
  <g transform="translate(250, 270)">
    <!-- Concentric circles -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="#1e3a5f" stroke-width="1"/>
    <circle cx="0" cy="0" r="135" fill="none" stroke="#1e3a5f" stroke-width="1"/>
    <circle cx="0" cy="0" r="90" fill="none" stroke="#1e3a5f" stroke-width="1"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#1e3a5f" stroke-width="1"/>

    <!-- Axis lines -->
    <line x1="0" y1="-180" x2="0" y2="180" stroke="#1e3a5f" stroke-width="1"/>
    <line x1="-180" y1="0" x2="180" y2="0" stroke="#1e3a5f" stroke-width="1"/>
    <line x1="-127" y1="-127" x2="127" y2="127" stroke="#1e3a5f" stroke-width="1"/>
    <line x1="127" y1="-127" x2="-127" y2="127" stroke="#1e3a5f" stroke-width="1"/>

    <!-- Data polygon - Skills Gap percentages -->
    <!-- AI/ML: 34%, Cloud: 30%, Zero Trust: 27%, DFIR: 25% -->
    <polygon points="0,-153 108,-108 135,0 113,113 0,135 -90,90 -108,0 -122,-122"
             fill="#00ffcc" fill-opacity="0.3" stroke="#00ffcc" stroke-width="2" filter="url(#glow3)"/>

    <!-- Data points -->
    <circle cx="0" cy="-153" r="8" fill="#00ffcc"/>
    <circle cx="135" cy="0" r="8" fill="#00ffcc"/>
    <circle cx="0" cy="135" r="8" fill="#00ffcc"/>
    <circle cx="-108" cy="0" r="8" fill="#00ffcc"/>
  </g>

  <!-- Labels -->
  <text x="250" y="75" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">AI/ML Security</text>
  <text x="250" y="92" fill="#f59e0b" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">34% gap</text>

  <text x="430" y="270" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Cloud Security</text>
  <text x="430" y="287" fill="#f59e0b" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">30% gap</text>

  <text x="250" y="445" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Zero Trust</text>
  <text x="250" y="462" fill="#f59e0b" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">27% gap</text>

  <text x="70" y="270" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">DFIR</text>
  <text x="70" y="287" fill="#f59e0b" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">25% gap</text>

  <!-- Source -->
  <text x="250" y="490" fill="#8b9dc3" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Source: ISC2 Cybersecurity Workforce Study 2026</text>
</svg>
