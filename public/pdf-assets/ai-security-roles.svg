<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550">
  <defs>
    <linearGradient id="bgGradAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2d4a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <filter id="glowAI">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="550" fill="url(#bgGradAI)"/>

  <!-- Title -->
  <text x="400" y="40" fill="url(#aiGrad)" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" filter="url(#glowAI)">AI + Cybersecurity: The New Frontier</text>

  <!-- Center brain/AI icon -->
  <g transform="translate(400, 140)">
    <circle cx="0" cy="0" r="50" fill="#0d1f3c" stroke="url(#aiGrad)" stroke-width="3"/>
    <!-- Neural network nodes -->
    <circle cx="0" cy="-25" r="8" fill="#8b5cf6"/>
    <circle cx="-22" cy="-10" r="6" fill="#06b6d4"/>
    <circle cx="22" cy="-10" r="6" fill="#06b6d4"/>
    <circle cx="-15" cy="15" r="7" fill="#8b5cf6"/>
    <circle cx="15" cy="15" r="7" fill="#8b5cf6"/>
    <circle cx="0" cy="30" r="5" fill="#06b6d4"/>
    <!-- Connections -->
    <line x1="0" y1="-25" x2="-22" y2="-10" stroke="#8b5cf6" stroke-width="1.5" opacity="0.7"/>
    <line x1="0" y1="-25" x2="22" y2="-10" stroke="#8b5cf6" stroke-width="1.5" opacity="0.7"/>
    <line x1="-22" y1="-10" x2="-15" y2="15" stroke="#06b6d4" stroke-width="1.5" opacity="0.7"/>
    <line x1="22" y1="-10" x2="15" y2="15" stroke="#06b6d4" stroke-width="1.5" opacity="0.7"/>
    <line x1="-15" y1="15" x2="0" y2="30" stroke="#8b5cf6" stroke-width="1.5" opacity="0.7"/>
    <line x1="15" y1="15" x2="0" y2="30" stroke="#8b5cf6" stroke-width="1.5" opacity="0.7"/>
    <line x1="-15" y1="15" x2="15" y2="15" stroke="#06b6d4" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- Salary premium banner -->
  <rect x="250" y="200" width="300" height="40" rx="20" fill="#0d1f3c" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="226" fill="#f59e0b" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">56% WAGE PREMIUM FOR AI SKILLS</text>

  <!-- Current Roles Section -->
  <text x="200" y="280" fill="#00ffcc" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">CURRENT ROLES (2026)</text>

  <!-- Role cards - Current -->
  <rect x="50" y="300" width="140" height="80" rx="8" fill="#0d1f3c" stroke="#00ffcc" stroke-width="2"/>
  <text x="120" y="325" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">AI Security</text>
  <text x="120" y="340" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Engineer</text>
  <text x="120" y="365" fill="#00ffcc" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">$152K-$210K</text>

  <rect x="210" y="300" width="140" height="80" rx="8" fill="#0d1f3c" stroke="#00ffcc" stroke-width="2"/>
  <text x="280" y="325" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ML Security</text>
  <text x="280" y="340" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Researcher</text>
  <text x="280" y="365" fill="#00ffcc" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">$140K-$200K</text>

  <!-- Emerging Roles Section -->
  <text x="600" y="280" fill="#f59e0b" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">EMERGING ROLES (2026-2028)</text>

  <!-- Role cards - Emerging -->
  <rect x="450" y="300" width="140" height="80" rx="8" fill="#0d1f3c" stroke="#f59e0b" stroke-width="2"/>
  <text x="520" y="325" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">AI Red Team</text>
  <text x="520" y="340" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Specialist</text>
  <text x="520" y="365" fill="#f59e0b" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">$160K-$220K</text>

  <rect x="610" y="300" width="140" height="80" rx="8" fill="#0d1f3c" stroke="#f59e0b" stroke-width="2"/>
  <text x="680" y="325" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">AI Governance</text>
  <text x="680" y="340" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Lead</text>
  <text x="680" y="365" fill="#f59e0b" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">$150K-$190K</text>

  <!-- Future Roles Section -->
  <text x="400" y="420" fill="#8b5cf6" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">FUTURE OPPORTUNITIES (2028+)</text>

  <rect x="100" y="440" width="180" height="70" rx="8" fill="#0d1f3c" stroke="#8b5cf6" stroke-width="2"/>
  <text x="190" y="465" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">AGI Safety Engineer</text>
  <text x="190" y="490" fill="#8b5cf6" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">$200K-$350K+</text>

  <rect x="310" y="440" width="180" height="70" rx="8" fill="#0d1f3c" stroke="#8b5cf6" stroke-width="2"/>
  <text x="400" y="465" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">AI Threat Hunter</text>
  <text x="400" y="490" fill="#8b5cf6" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">$170K-$250K</text>

  <rect x="520" y="440" width="180" height="70" rx="8" fill="#0d1f3c" stroke="#8b5cf6" stroke-width="2"/>
  <text x="610" y="465" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Autonomous System Auditor</text>
  <text x="610" y="490" fill="#8b5cf6" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">$180K-$280K</text>

  <!-- Connecting lines -->
  <line x1="120" y1="380" x2="190" y2="440" stroke="#00ffcc" stroke-width="1" stroke-dasharray="4" opacity="0.5"/>
  <line x1="280" y1="380" x2="400" y2="440" stroke="#00ffcc" stroke-width="1" stroke-dasharray="4" opacity="0.5"/>
  <line x1="520" y1="380" x2="400" y2="440" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4" opacity="0.5"/>
  <line x1="680" y1="380" x2="610" y2="440" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4" opacity="0.5"/>
</svg>
