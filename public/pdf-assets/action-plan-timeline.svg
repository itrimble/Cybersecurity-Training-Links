<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2d4a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow5">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="url(#bgGrad5)"/>

  <!-- Title -->
  <text x="400" y="35" fill="#00ffcc" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" filter="url(#glow5)">30-Day Action Plan</text>

  <!-- Timeline line -->
  <line x1="100" y1="150" x2="700" y2="150" stroke="#1e3a5f" stroke-width="4"/>

  <!-- Week markers -->
  <!-- Week 1 -->
  <circle cx="175" cy="150" r="35" fill="#0d1f3c" stroke="#00ffcc" stroke-width="3"/>
  <text x="175" y="145" fill="#00ffcc" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">WEEK</text>
  <text x="175" y="162" fill="#00ffcc" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">1</text>
  <text x="175" y="210" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Foundation</text>
  <text x="175" y="228" fill="#8b9dc3" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Home Lab Setup</text>
  <text x="175" y="243" fill="#8b9dc3" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">TryHackMe Start</text>
  <text x="175" y="258" fill="#8b9dc3" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Sec+ Study Begin</text>

  <!-- Week 2 -->
  <circle cx="325" cy="150" r="35" fill="#0d1f3c" stroke="#f59e0b" stroke-width="3"/>
  <text x="325" y="145" fill="#f59e0b" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">WEEK</text>
  <text x="325" y="162" fill="#f59e0b" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">2</text>
  <text x="325" y="210" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Hands-On</text>
  <text x="325" y="228" fill="#8b9dc3" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">CTF Practice</text>
  <text x="325" y="243" fill="#8b9dc3" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Linux Fundamentals</text>
  <text x="325" y="258" fill="#8b9dc3" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Wireshark Basics</text>

  <!-- Week 3 -->
  <circle cx="475" cy="150" r="35" fill="#0d1f3c" stroke="#3b82f6" stroke-width="3"/>
  <text x="475" y="145" fill="#3b82f6" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">WEEK</text>
  <text x="475" y="162" fill="#3b82f6" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">3</text>
  <text x="475" y="210" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Build Brand</text>
  <text x="475" y="228" fill="#8b9dc3" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">LinkedIn Update</text>
  <text x="475" y="243" fill="#8b9dc3" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Join Communities</text>
  <text x="475" y="258" fill="#8b9dc3" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Start Blog/GitHub</text>

  <!-- Week 4 -->
  <circle cx="625" cy="150" r="35" fill="#0d1f3c" stroke="#10b981" stroke-width="3"/>
  <text x="625" y="145" fill="#10b981" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">WEEK</text>
  <text x="625" y="162" fill="#10b981" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">4</text>
  <text x="625" y="210" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Career Prep</text>
  <text x="625" y="228" fill="#8b9dc3" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Research Jobs</text>
  <text x="625" y="243" fill="#8b9dc3" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Build Resume</text>
  <text x="625" y="258" fill="#8b9dc3" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Apply + Plan 90-Day</text>

  <!-- Progress indicator -->
  <rect x="100" y="85" width="600" height="25" rx="12" fill="#0d1f3c" stroke="#1e3a5f" stroke-width="1"/>
  <rect x="102" y="87" width="146" height="21" rx="10" fill="#00ffcc" opacity="0.3"/>
  <rect x="248" y="87" width="150" height="21" rx="10" fill="#f59e0b" opacity="0.3"/>
  <rect x="398" y="87" width="150" height="21" rx="10" fill="#3b82f6" opacity="0.3"/>
  <rect x="548" y="87" width="150" height="21" rx="10" fill="#10b981" opacity="0.3"/>
  <text x="175" y="102" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Days 1-7</text>
  <text x="325" y="102" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Days 8-14</text>
  <text x="475" y="102" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Days 15-21</text>
  <text x="625" y="102" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Days 22-30</text>
</svg>
