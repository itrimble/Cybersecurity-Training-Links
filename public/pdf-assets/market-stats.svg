<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2d4a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffcc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00b894;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGrad4)"/>

  <!-- Title -->
  <text x="400" y="40" fill="#00ffcc" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" filter="url(#glow4)">The Cybersecurity Opportunity</text>

  <!-- Stat Cards -->
  <!-- Card 1 -->
  <rect x="40" y="80" width="170" height="140" rx="12" fill="#0d1f3c" stroke="#00ffcc" stroke-width="2"/>
  <text x="125" y="120" fill="#00ffcc" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" filter="url(#glow4)">4.8M</text>
  <text x="125" y="150" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Global</text>
  <text x="125" y="168" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Workforce Gap</text>
  <text x="125" y="200" fill="#8b9dc3" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">ISC2 2024</text>

  <!-- Card 2 -->
  <rect x="230" y="80" width="170" height="140" rx="12" fill="#0d1f3c" stroke="#f59e0b" stroke-width="2"/>
  <text x="315" y="120" fill="#f59e0b" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" filter="url(#glow4)">457K</text>
  <text x="315" y="150" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">U.S. Job</text>
  <text x="315" y="168" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Openings</text>
  <text x="315" y="200" fill="#8b9dc3" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">CyberSeek Mar 2026</text>

  <!-- Card 3 -->
  <rect x="420" y="80" width="170" height="140" rx="12" fill="#0d1f3c" stroke="#3b82f6" stroke-width="2"/>
  <text x="505" y="120" fill="#3b82f6" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" filter="url(#glow4)">29%</text>
  <text x="505" y="150" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Job Growth</text>
  <text x="505" y="168" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">2024-2034</text>
  <text x="505" y="200" fill="#8b9dc3" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">BLS</text>

  <!-- Card 4 -->
  <rect x="610" y="80" width="150" height="140" rx="12" fill="#0d1f3c" stroke="#10b981" stroke-width="2"/>
  <text x="685" y="120" fill="#10b981" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" filter="url(#glow4)">$128K</text>
  <text x="685" y="150" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Median</text>
  <text x="685" y="168" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Salary</text>
  <text x="685" y="200" fill="#8b9dc3" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">ISC2 2026</text>

  <!-- Bottom Stats -->
  <rect x="40" y="250" width="350" height="120" rx="12" fill="#0d1f3c" stroke="#1e3a5f" stroke-width="1"/>
  <text x="215" y="285" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Why Now?</text>

  <circle cx="70" cy="315" r="6" fill="#00ffcc"/>
  <text x="85" y="320" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">60% rise in cyberattacks driving demand</text>

  <circle cx="70" cy="340" r="6" fill="#f59e0b"/>
  <text x="85" y="345" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">65% of employers use skills-based hiring</text>

  <circle cx="70" cy="365" r="6" fill="#3b82f6"/>
  <text x="85" y="370" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">48% of workforce is remote/hybrid</text>

  <!-- Remote Work Pie -->
  <g transform="translate(580, 320)">
    <circle cx="0" cy="0" r="55" fill="#1e3a5f"/>
    <path d="M0,0 L0,-55 A55,55 0 0,1 52.3,-17 Z" fill="#00ffcc"/>
    <text x="0" y="5" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">48%</text>
    <text x="0" y="85" fill="#8b9dc3" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Remote/Hybrid Work</text>
  </g>
</svg>
